<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vocab Journey</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --bg: #f2f2f7; --card-bg: #ffffff; --primary: #007AFF; --text: #1c1c1e; --text-sec: #636366; --hot-pink: #FF1493; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }

        header { padding: 60px 20px 10px; text-align: center; }
        
        #menu-screen, #app-screen { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            box-sizing: border-box; 
            position: relative;
            justify-content: center; /* Centers the whole group */
        }

        #app-screen { display: none; }

        /* --- TOP CONTROLS (Back & Watermark) --- */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px; /* Distance to the card */
            padding: 0 10px;
        }

        .back-btn-box {
            background: var(--hot-pink); 
            color: white; 
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(255, 20, 147, 0.3);
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .back-btn-box:active { transform: scale(0.95); }

        .watermark {
            text-align: right;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.2); 
            line-height: 1.3;
            font-weight: 700;
        }

        /* --- FLASHCARD --- */
        .card-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            min-height: 440px; /* Slightly shorter for mobile tightness */
            border-radius: 35px; 
            padding: 25px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
        }
        
        .word-text { font-size: 42px; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
        .example-box { opacity: 0; transform: translateY(5px); transition: 0.4s ease; background: #f1f1f4; padding: 15px; border-radius: 18px; font-style: italic; color: #3a3a3c; margin: 10px 0; font-size: 18px; line-height: 1.4; }
        .details-box { opacity: 0; transform: translateY(5px); transition: 0.4s ease; text-align: left; border-top: 1px solid #eee; padding-top: 15px; }
        
        .reveal-1 .example-box { opacity: 1; transform: translateY(0); }
        .reveal-2 .example-box, .reveal-2 .details-box { opacity: 1; transform: translateY(0); }
        
        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--primary); margin-bottom: 5px; }
        .meaning-text { font-size: 17px; line-height: 1.4; margin-bottom: 15px; font-weight: 500; }
        .chip { display: inline-block; padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-right: 5px; margin-bottom: 5px; }
        .syn { background: #E3F2FD; color: #1976D2; }
        .ant { background: #FFF3E0; color: #E65100; }
        
        /* --- BOTTOM NAVIGATION --- */
        .nav-bar { 
            display: flex; 
            gap: 12px; 
            padding: 15px 5px 0; /* Tightened top padding */
        }

        .nav-btn { 
            flex: 1; 
            padding: 18px; 
            border-radius: 18px; 
            border: none; 
            font-size: 17px; 
            font-weight: 700; 
            transition: transform 0.1s ease; 
        }
        .nav-btn:active { transform: scale(0.96); }
        .btn-prev { background: #e5e5ea; }
        .btn-next { background: var(--primary); color: white; }
        
        .progress { text-align: center; font-size: 13px; color: var(--text-sec); margin-top: 8px; font-weight: 600; }
        .sync-info { text-align: center; padding: 10px; color: var(--primary); font-size: 14px; font-weight: 600; margin-bottom: 10px; cursor: pointer; }
        .lesson-btn { background: var(--card-bg); padding: 22px; border-radius: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-weight: 700; font-size: 18px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <header><h1>Vocab Journey</h1></header>
        <div id="lesson-list"></div>
    </div>

    <div id="app-screen">
        <div class="top-controls">
            <div class="back-btn-box" onclick="goBack()">
                <span>← Lessons</span>
            </div>
            <div class="watermark">
                Mahfuz Ahmed<br>
                +8801770852182
            </div>
        </div>

        <div class="card-container">
            <div id="main-card" class="card" onclick="handleCardClick()">
                <div id="display-word" class="word-text"></div>
                <div id="display-example" class="example-box"></div>
                <div id="display-details" class="details-box">
                    <div class="label">Meaning</div>
                    <div id="display-meaning" class="meaning-text"></div>
                    <div class="label">Synonyms</div><div id="display-syn"></div>
                    <div class="label" style="margin-top:8px;">Antonyms</div><div id="display-ant"></div>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn btn-prev" onclick="prevWord()">Back</button>
            <button class="nav-btn btn-next" onclick="nextWord()">Next Word</button>
        </div>
        <div id="progress-text" class="progress"></div>
    </div>

    <script>
        const MASTER_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKa_UznG5YNoBdDDz6O1oLPpg27HOeRbvAyEJ430icuHl4ki9gZt3o7VakCabFia3JmAOvTgbASuN8/pub?gid=0&single=true&output=csv";

        let db = {};
        let currentLessonData = [];
        let currentIndex = 0;
        let revealStep = 0;

        async function init() {
            const listEl = document.getElementById('lesson-list');
            listEl.innerHTML = '<p style="text-align:center">Syncing Master List...</p>';
            try {
                const response = await fetch(MASTER_SHEET_URL + `&cb=${Date.now()}`, { cache: "no-store" });
                const csvText = await response.text();
                parseMasterSheet(csvText);
                renderMenu();
            } catch (err) {
                listEl.innerHTML = '<p style="text-align:center; color:red;">Sync Failed. Tap to retry.</p>';
                listEl.onclick = init;
            }
        }

        function parseMasterSheet(text) {
            db = {}; 
            const lines = text.split(/\r?\n/);
            const dataRows = lines.slice(1); 
            let lessonCounter = 1;
            let currentLessonTitle = "Lesson " + lessonCounter;
            db[currentLessonTitle] = [];

            dataRows.forEach(line => {
                if (line.trim() === '') return;
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
                    else cell += char;
                }
                result.push(cell.trim());
                const word = result[0] || "";
                if (word === "") {
                    if (db[currentLessonTitle].length > 0) {
                        lessonCounter++;
                        currentLessonTitle = "Lesson " + lessonCounter;
                        db[currentLessonTitle] = [];
                    }
                } else {
                    db[currentLessonTitle].push({
                        word: word, example: result[1] || "", meaning: result[2] || "",
                        syns: [result[3] || "", result[4] || ""], ants: [result[5] || "", result[6] || ""]
                    });
                }
            });
            Object.keys(db).forEach(key => { if(db[key].length === 0) delete db[key]; });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderMenu() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = `<div class="sync-info" onclick="init()">↻ Force Sync Sheets</div>`;
            Object.keys(db).forEach(name => {
                const d = document.createElement('div');
                d.className = 'lesson-btn';
                d.innerHTML = `<span>${name}</span><span>→</span>`;
                d.onclick = () => {
                    currentLessonData = shuffleArray([...db[name]]);
                    currentIndex = 0;
                    document.getElementById('menu-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    updateCard();
                };
                list.appendChild(d);
            });
        }

        function handleCardClick() {
            if (revealStep < 2) {
                revealStep++;
                document.getElementById('main-card').className = `card reveal-${revealStep}`;
            }
        }

        function updateCard() {
            const data = currentLessonData[currentIndex];
            revealStep = 0;
            document.getElementById('main-card').className = 'card';
            document.getElementById('display-word').innerText = data.word;
            document.getElementById('display-example').innerText = data.example;
            document.getElementById('display-meaning').innerText = data.meaning;
            document.getElementById('display-syn').innerHTML = data.syns.filter(s => s).map(s => `<span class="chip syn">${s}</span>`).join('');
            document.getElementById('display-ant').innerHTML = data.ants.filter(a => a).map(a => `<span class="chip ant">${a}</span>`).join('');
            document.getElementById('progress-text').innerText = `${currentIndex + 1} of ${currentLessonData.length}`;
        }

        function nextWord() {
            if (currentIndex < currentLessonData.length - 1) { currentIndex++; updateCard(); }
            else { alert("Lesson Complete!"); goBack(); }
        }

        function prevWord() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        function goBack() { document.getElementById('menu-screen').style.display = 'flex'; document.getElementById('app-screen').style.display = 'none'; }

        init();
    </script>
</body>
</html>
