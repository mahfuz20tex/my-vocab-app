<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vocab Journey</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vocab Journey">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007AFF/ffffff?text=VJ">

    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007AFF;
            --text: #1c1c1e;
            --text-sec: #636366;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Screens --- */
        header { padding: 60px 20px 20px; text-align: center; }
        #menu-screen, #app-screen { flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #app-screen { display: none; }

        /* --- Lesson List --- */
        .lesson-btn {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-weight: 700;
            font-size: 19px;
            transition: transform 0.2s;
        }
        .lesson-btn:active { transform: scale(0.97); }

        /* --- Flashcard UI --- */
        .card-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        .card {
            background: var(--card-bg);
            width: 100%;
            min-height: 480px;
            border-radius: 40px;
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .word-text { font-size: 48px; font-weight: 800; margin-bottom: 25px; letter-spacing: -1px; }
        
        .example-box { 
            opacity: 0; transform: translateY(10px); transition: 0.4s ease;
            background: #f1f1f4; padding: 20px; border-radius: 22px;
            font-style: italic; color: #3a3a3c; margin: 15px 0; font-size: 20px; line-height: 1.4;
        }

        .details-box { opacity: 0; transform: translateY(10px); transition: 0.4s ease; text-align: left; border-top: 1px solid #eee; padding-top: 20px; }
        
        /* Reveal Logic States */
        .reveal-1 .example-box { opacity: 1; transform: translateY(0); }
        .reveal-2 .example-box, .reveal-2 .details-box { opacity: 1; transform: translateY(0); }

        .label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary); margin-bottom: 8px; }
        .meaning-text { font-size: 19px; line-height: 1.5; margin-bottom: 20px; font-weight: 500; }

        .chip { display: inline-block; padding: 7px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-right: 6px; margin-bottom: 6px; }
        .syn { background: #E3F2FD; color: #1976D2; }
        .ant { background: #FFF3E0; color: #E65100; }

        /* --- Navigation --- */
        .nav-bar { display: flex; gap: 15px; padding: 25px 0 10px; }
        .nav-btn { flex: 1; padding: 22px; border-radius: 22px; border: none; font-size: 18px; font-weight: 700; transition: opacity 0.2s; }
        .btn-prev { background: #e5e5ea; color: var(--text); }
        .btn-next { background: var(--primary); color: white; }
        .nav-btn:active { opacity: 0.7; }

        .progress { text-align: center; font-size: 14px; color: var(--text-sec); margin-top: 10px; font-weight: 600; }
        #status-msg { text-align: center; color: var(--text-sec); padding: 40px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <header><h1>Vocab Journey</h1></header>
        <div id="lesson-list"><p id="status-msg">Syncing your Google Sheet...</p></div>
    </div>

    <div id="app-screen">
        <div onclick="goBack()" style="color: var(--primary); font-weight: 700; margin-bottom: 20px; font-size: 18px; cursor: pointer;">← Lessons</div>
        
        <div class="card-container">
            <div id="main-card" class="card" onclick="handleCardClick()">
                <div id="display-word" class="word-text"></div>
                <div id="display-example" class="example-box"></div>
                
                <div id="display-details" class="details-box">
                    <div class="label">Meaning</div>
                    <div id="display-meaning" class="meaning-text"></div>
                    
                    <div class="label">Synonyms</div>
                    <div id="display-syn"></div>
                    
                    <div class="label" style="margin-top:10px;">Antonyms</div>
                    <div id="display-ant"></div>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-btn btn-prev" onclick="prevWord()">Back</button>
            <button class="nav-btn btn-next" onclick="nextWord()">Next Word</button>
        </div>
        <div id="progress-text" class="progress"></div>
    </div>

    <script>
        // --- 1. YOUR GOOGLE SHEET LINK ---
        const sheetLinks = {
            "Lesson 1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKa_UznG5YNoBdDDz6O1oLPpg27HOeRbvAyEJ430icuHl4ki9gZt3o7VakCabFia3JmAOvTgbASuN8/pub?gid=0&single=true&output=csv"
        };

        let db = {};
        let currentLessonData = [];
        let currentIndex = 0;
        let revealStep = 0;

        // --- 2. THE LOGIC ---
        async function init() {
            try {
                for (const [name, url] of Object.entries(sheetLinks)) {
                    const response = await fetch(url);
                    const csvText = await response.text();
                    db[name] = smartParse(csvText);
                }
                renderMenu();
            } catch (err) {
                document.getElementById('status-msg').innerText = "Error: Please verify your Google Sheet is 'Published to Web' as CSV.";
            }
        }

        // Smart CSV logic handles full sentences with spaces and commas inside quotes
        function smartParse(text) {
            const lines = text.split(/\r?\n/);
            const dataRows = lines.slice(1).filter(line => line.trim() !== '');

            return dataRows.map(line => {
                const result = [];
                let cell = '';
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(cell.trim());
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                result.push(cell.trim());

                return {
                    word: result[0] || "",
                    example: result[1] || "",
                    meaning: result[2] || "",
                    syns: [result[3] || "", result[4] || ""],
                    ants: [result[5] || "", result[6] || ""]
                };
            }).filter(item => item.word);
        }

        function renderMenu() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = '';
            Object.keys(db).forEach(name => {
                const d = document.createElement('div');
                d.className = 'lesson-btn';
                d.innerHTML = `<span>${name}</span><span>→</span>`;
                d.onclick = () => {
                    currentLessonData = db[name];
                    currentIndex = 0;
                    document.getElementById('menu-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    updateCard();
                };
                list.appendChild(d);
            });
        }

        function handleCardClick() {
            if (revealStep < 2) {
                revealStep++;
                document.getElementById('main-card').className = `card reveal-${revealStep}`;
            }
        }

        function updateCard() {
            const data = currentLessonData[currentIndex];
            revealStep = 0;
            document.getElementById('main-card').className = 'card';
            
            document.getElementById('display-word').innerText = data.word;
            document.getElementById('display-example').innerText = data.example;
            document.getElementById('display-meaning').innerText = data.meaning;
            
            document.getElementById('display-syn').innerHTML = data.syns.filter(s => s).map(s => `<span class="chip syn">${s}</span>`).join('');
            document.getElementById('display-ant').innerHTML = data.ants.filter(a => a).map(a => `<span class="chip ant">${a}</span>`).join('');
            
            document.getElementById('progress-text').innerText = `${currentIndex + 1} of ${currentLessonData.length}`;
        }

        function nextWord() {
            if (currentIndex < currentLessonData.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert("You've completed this lesson!");
                goBack();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function goBack() {
            document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
