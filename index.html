<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VocabFlow Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VocabFlow">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007AFF/ffffff?text=V">

    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007AFF;
            --text-main: #1c1c1e;
            --text-sec: #8e8e93;
            --accent: #5856d6;
            --transition-speed: 0.4s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 60px 20px 20px;
            text-align: center;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 { font-size: 34px; font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* --- Lesson Screen Animations --- */
        #lesson-screen {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .lesson-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            animation: slideInUp 0.5s ease-out both;
        }

        .lesson-card:active { transform: scale(0.96); background: #f9f9fb; }

        /* --- Flashcard Screen --- */
        #flashcard-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 40px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease;
        }

        .back-btn {
            color: var(--primary);
            font-weight: 600;
            border: none;
            background: none;
            font-size: 17px;
            padding: 10px 0;
            margin-bottom: 10px;
        }

        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            min-height: 400px;
            max-height: 500px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        /* Nav animation class */
        .card.switching { animation: cardSwap 0.4s ease-in-out; }

        .word-display { 
            font-size: 42px; 
            font-weight: 800; 
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .example-display { 
            font-size: 18px; 
            color: var(--text-sec); 
            font-style: italic; 
            margin: 10px 0;
            padding: 15px;
            background: #f9f9fb;
            border-radius: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .details-display {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: left;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        /* Active Reveal States */
        .reveal-1 .example-display { opacity: 1; transform: translateY(0); }
        .reveal-2 .example-display { opacity: 1; transform: translateY(0); }
        .reveal-2 .details-display { opacity: 1; transform: translateY(0); }

        .meaning-title { font-weight: 700; color: var(--accent); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .meaning-text { font-size: 17px; margin: 4px 0 12px; line-height: 1.4; }
        
        .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .chip { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .syn-chip { background: #e1f5fe; color: #0288d1; }
        .ant-chip { background: #fff3e0; color: #f57c00; }

        /* --- Navigation --- */
        .controls { display: flex; gap: 15px; margin-top: 25px; }
        .nav-btn {
            flex: 1;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s active;
        }
        .prev-btn { background: #e5e5ea; color: var(--text-main); }
        .next-btn { background: var(--primary); color: white; }
        .nav-btn:active { transform: scale(0.95); opacity: 0.8; }

        /* --- Keyframes --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { 
            from { opacity: 0; transform: translateY(-20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardSwap {
            0% { opacity: 1; transform: translateX(0); }
            45% { opacity: 0; transform: translateX(-30px); }
            55% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .progress-text { text-align: center; color: var(--text-sec); font-size: 13px; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

    <div id="lesson-screen">
        <header>
            <h1>My Vocabulary</h1>
        </header>
        <div id="lesson-list"></div>
    </div>

    <div id="flashcard-screen">
        <button class="back-btn" onclick="showLessons()">← Lessons</button>
        
        <div class="card-container">
            <div class="card" id="vocab-card" onclick="nextStep()">
                <div id="word" class="word-display">Word</div>
                
                <div id="example-box" class="example-display">
                    "Example sentence goes here."
                </div>
                
                <div id="details-box" class="details-display">
                    <div class="meaning-title">Meaning</div>
                    <div id="meaning" class="meaning-text">Definition</div>
                    
                    <div class="meaning-title" style="color: #0288d1;">Synonyms</div>
                    <div id="synonyms" class="chips-container"></div>
                    
                    <div class="meaning-title" style="color: #f57c00;">Antonyms</div>
                    <div id="antonyms" class="chips-container"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn prev-btn" id="prevBtn" onclick="prevWord()">Back</button>
            <button class="nav-btn next-btn" onclick="nextWord()">Next Word</button>
        </div>
        <div class="progress-text" id="progress">1 of 3</div>
    </div>

    <script>
        const vocabularyData = {
            "Lesson 1: Essentials": [
                {
                    word: "Banal",
                    example: "The plot of the movie was so banal that I fell asleep halfway through.",
                    meaning: "Lacking in originality as to be obvious and boring.",
                    syn: ["Trite", "Hackneyed"],
                    ant: ["Original", "Innovative"]
                },
                {
                    word: "Malleable",
                    example: "Gold is a very malleable metal, making it ideal for intricate jewelry.",
                    meaning: "Able to be hammered or pressed out of shape; easily influenced.",
                    syn: ["Pliable", "Ductile"],
                    ant: ["Rigid", "Inflexible"]
                },
                {
                    word: "Commendable",
                    example: "His dedication to the charity project was truly commendable.",
                    meaning: "Deserving praise and approval.",
                    syn: ["Praiseworthy", "Admirable"],
                    ant: ["Reprehensible", "Deplorable"]
                },
                {
                    word: "Dhurandhar",
                    example: "His dedication to the charity project was truly commendable.",
                    meaning: "Deserving praise and approval.",
                    syn: ["Praiseworthy", "Admirable"],
                    ant: ["Reprehensible", "Deplorable"]
                }
            ],
            "Lesson 2: Eloquence": [
                {
                    word: "Eloquence",
                    example: "The orator spoke with such eloquence that the audience was moved to tears.",
                    meaning: "Fluent or persuasive speaking or writing.",
                    syn: ["Fluency", "Articulacy"],
                    ant: ["Inarticulacy", "Dullness"]
                }
            ]
        };

        let currentLesson = [];
        let currentIndex = 0;
        let step = 0;

        function init() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = '';
            let delay = 0;
            for (let lessonTitle in vocabularyData) {
                const count = vocabularyData[lessonTitle].length;
                const div = document.createElement('div');
                div.className = 'lesson-card';
                div.style.animationDelay = `${delay}s`;
                div.innerHTML = `
                    <div class="lesson-info">
                        <h3>${lessonTitle}</h3>
                        <p>${count} Words</p>
                    </div>
                    <div style="color: #007AFF; font-weight: bold; font-size: 20px;">→</div>
                `;
                div.onclick = () => startLesson(lessonTitle);
                list.appendChild(div);
                delay += 0.1;
            }
        }

        function startLesson(title) {
            currentLesson = vocabularyData[title];
            currentIndex = 0;
            step = 0;
            document.getElementById('lesson-screen').style.display = 'none';
            document.getElementById('flashcard-screen').style.display = 'flex';
            updateCard(false);
        }

        function showLessons() {
            document.getElementById('lesson-screen').style.display = 'block';
            document.getElementById('flashcard-screen').style.display = 'none';
            init(); // Re-trigger animations
        }

        function nextStep() {
            if (step < 2) {
                step++;
                const card = document.getElementById('vocab-card');
                card.className = `card reveal-${step}`;
            }
        }

        function updateCard(animate = true) {
            const card = document.getElementById('vocab-card');
            
            if (animate) {
                card.classList.add('switching');
                setTimeout(() => {
                    renderData();
                    card.classList.remove('switching');
                }, 200);
            } else {
                renderData();
            }
        }

        function renderData() {
            const data = currentLesson[currentIndex];
            const card = document.getElementById('vocab-card');
            
            step = 0;
            card.className = 'card'; // Reset reveal classes

            document.getElementById('word').innerText = data.word;
            document.getElementById('example-box').innerText = `"${data.example}"`;
            document.getElementById('meaning').innerText = data.meaning;
            
            const synContainer = document.getElementById('synonyms');
            const antContainer = document.getElementById('antonyms');
            synContainer.innerHTML = '';
            antContainer.innerHTML = '';
            
            data.syn.forEach(s => synContainer.innerHTML += `<span class="chip syn-chip">${s}</span>`);
            data.ant.forEach(a => antContainer.innerHTML += `<span class="chip ant-chip">${a}</span>`);

            document.getElementById('progress').innerText = `${currentIndex + 1} of ${currentLesson.length}`;
            document.getElementById('prevBtn').style.visibility = (currentIndex === 0) ? 'hidden' : 'visible';
        }

        function nextWord() {
            if (currentIndex < currentLesson.length - 1) {
                currentIndex++;
                updateCard(true);
            } else {
                alert("🎉 Lesson Complete!");
                showLessons();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard(true);
            }
        }

        init();
    </script>
</body>
</html>
