<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vocab Journey</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f2f7">

    <style>
        :root {
            --bg: #f2f2f7; --card-bg: #ffffff; --primary: #007AFF; --text: #1c1c1e;
            --text-sec: #636366; --hot-pink: #FF1493;
            /* Safe areas: fall back to sane padding when not in standalone mode */
            --safe-top: max(env(safe-area-inset-top, 0px), 20px);
            --safe-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh; /* dynamic viewport: correct in standalone mode */
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* stops the rubber-band pull exposing the grey behind */
        }

        header {
            /* Status bar clearance + breathing room */
            padding: calc(var(--safe-top) + 24px) 20px 10px;
            text-align: center;
        }

        #menu-screen, #app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px calc(15px + var(--safe-right)) calc(15px + var(--safe-bottom)) calc(15px + var(--safe-left));
            box-sizing: border-box;
            position: relative;
            justify-content: flex-start;
        }

        #app-screen {
            display: none;
            /* Push the whole study screen below the notch / status bar */
            padding-top: calc(var(--safe-top) + 12px);
            /* Reserve room for the pinned bottom bar so the card never hides under it */
            padding-bottom: calc(var(--safe-bottom) + 130px);
        }

        /* --- TOP CONTROLS (Back & Watermark) --- */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
            padding: 0 10px;
        }

        .back-btn-box {
            background: var(--hot-pink);
            color: white;
            padding: 12px 20px; /* slightly taller = easier thumb target */
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(255, 20, 147, 0.3);
            border: none;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .back-btn-box:active {
            transform: scale(0.92);
            box-shadow: 0 2px 5px rgba(255, 20, 147, 0.25);
        }

        .watermark {
            text-align: right;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.2);
            line-height: 1.3;
            font-weight: 700;
        }

        /* --- FLASHCARD --- */
        .card-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            min-height: 440px;
            border-radius: 35px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        /* Card entrance animations (next = slide from right, prev = from left) */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(45px) scale(0.97); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-45px) scale(0.97); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        .card.anim-next { animation: slideInRight 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
        .card.anim-prev { animation: slideInLeft  0.32s cubic-bezier(0.22, 1, 0.36, 1); }

        /* Tap-to-reveal pulse */
        @keyframes cardTap {
            0%   { transform: scale(1); }
            45%  { transform: scale(0.985); }
            100% { transform: scale(1); }
        }
        .card.tap-pulse { animation: cardTap 0.18s ease; }

        .word-text { font-size: 42px; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; }
        .example-box { opacity: 0; transform: translateY(5px); transition: 0.4s ease; background: #f1f1f4; padding: 15px; border-radius: 18px; font-style: italic; color: #3a3a3c; margin: 10px 0; font-size: 18px; line-height: 1.4; }
        .details-box { opacity: 0; transform: translateY(5px); transition: 0.4s ease; text-align: left; border-top: 1px solid #eee; padding-top: 15px; }

        .reveal-1 .example-box { opacity: 1; transform: translateY(0); }
        .reveal-2 .example-box, .reveal-2 .details-box { opacity: 1; transform: translateY(0); }

        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--primary); margin-bottom: 5px; }
        .meaning-text { font-size: 17px; line-height: 1.4; margin-bottom: 15px; font-weight: 500; }
        .chip { display: inline-block; padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-right: 5px; margin-bottom: 5px; }
        .syn { background: #E3F2FD; color: #1976D2; }
        .ant { background: #FFF3E0; color: #E65100; }

        /* --- BOTTOM NAVIGATION (pinned, like the Lessons button up top) --- */
        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px calc(20px + var(--safe-right)) calc(var(--safe-bottom) + 6px) calc(20px + var(--safe-left));
            box-sizing: border-box;
            /* Soft fade so the card edge doesn't clash if content runs long */
            background: linear-gradient(to top, var(--bg) 75%, rgba(242,242,247,0));
            z-index: 10;
        }

        .nav-bar {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            flex: 1;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease, filter 0.12s ease;
        }
        .nav-btn:active { transform: scale(0.94); filter: brightness(0.92); }

        /* Press "bounce-back" applied via JS so it also fires on quick taps */
        @keyframes btnBounce {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.92); }
            70%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .nav-btn.bounce, .back-btn-box.bounce { animation: btnBounce 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .btn-notyet { background: #FFF3E0; color: #E65100; }
        .btn-done { background: #34C759; color: white; box-shadow: 0 6px 14px rgba(52,199,89,0.3); }

        /* Badge shown when a previously-Done word comes back as a review filler */
        .review-badge {
            display: none;
            margin: 0 auto 12px;
            padding: 5px 14px;
            border-radius: 20px;
            background: #E8F8EC;
            color: #1F9D45;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: fit-content;
        }
        .card.is-review .review-badge { display: block; }

        .progress { text-align: center; font-size: 13px; color: var(--text-sec); margin-top: 10px; font-weight: 600; }
        .sync-info { text-align: center; padding: 10px; color: var(--primary); font-size: 14px; font-weight: 600; margin-bottom: 10px; cursor: pointer; }

        .lesson-btn {
            background: var(--card-bg); padding: 22px; border-radius: 18px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-weight: 700; font-size: 18px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .lesson-btn:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        /* Respect users with motion sensitivity */
        @media (prefers-reduced-motion: reduce) {
            .card.anim-next, .card.anim-prev, .card.tap-pulse,
            .nav-btn.bounce, .back-btn-box.bounce { animation: none; }
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <header><h1>Vocab Journey</h1></header>
        <div id="lesson-list"></div>
    </div>

    <div id="app-screen">
        <div class="top-controls">
            <div class="back-btn-box" id="back-btn" onclick="goBack(event)">
                <span>← Lessons</span>
            </div>
            <div class="watermark">
                Mahfuz Ahmed<br>
                +8801770852182
            </div>
        </div>

        <div class="card-container">
            <div id="main-card" class="card" onclick="handleCardClick()">
                <div class="review-badge">✓ Quick Review</div>
                <div id="display-word" class="word-text"></div>
                <div id="display-example" class="example-box"></div>
                <div id="display-details" class="details-box">
                    <div class="label">Meaning</div>
                    <div id="display-meaning" class="meaning-text"></div>
                    <div class="label">Synonyms</div><div id="display-syn"></div>
                    <div class="label" style="margin-top:8px;">Antonyms</div><div id="display-ant"></div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="nav-bar">
                <button class="nav-btn btn-notyet" onclick="markNotYet(event)">Not Yet</button>
                <button class="nav-btn btn-done" onclick="markDone(event)">Done ✓</button>
            </div>
            <div id="progress-text" class="progress"></div>
        </div>
    </div>

    <script>
        const MASTER_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKa_UznG5YNoBdDDz6O1oLPpg27HOeRbvAyEJ430icuHl4ki9gZt3o7VakCabFia3JmAOvTgbASuN8/pub?gid=0&single=true&output=csv";

        let db = {};

        /* --- Session state (resets every time a lesson opens) --- */
        let lessonWords = [];      // all words of the active lesson
        let queue = [];            // upcoming cards, front = next
        let currentWord = null;    // card on screen
        let doneCount = {};        // word-key -> number of "Done" presses
        let revealStep = 0;
        const MIN_GAP = 2;         // a returning word waits behind at least this many cards
        const DONES_NEEDED = 2;    // a word must be marked Done this many times to finish
        const wordKey = w => w.word + '|' + w.meaning; // unique id (handles duplicate words)
        const isMastered = k => (doneCount[k] || 0) >= DONES_NEEDED;

        /* ============================================================
           SOUND ENGINE — synthesized "KRING" bell (no audio file needed)
           ============================================================ */
        let audioCtx = null;

        function ensureAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            // iOS suspends the context until a user gesture — resume it
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Bright bell "kring!" — two detuned strikes with a fast shimmer
        function playKring() {
            ensureAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const master = audioCtx.createGain();
            master.gain.setValueAtTime(0.28, now);
            master.connect(audioCtx.destination);

            // Bell partials: fundamental + bright overtones (E6-ish bell)
            const partials = [
                { freq: 1318.5, gain: 1.0,  decay: 0.45 },
                { freq: 1975.5, gain: 0.55, decay: 0.32 },
                { freq: 2637.0, gain: 0.35, decay: 0.22 },
                { freq: 3520.0, gain: 0.18, decay: 0.15 }
            ];

            partials.forEach(p => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(p.freq, now);
                // Tiny downward pitch settle = realistic bell strike
                osc.frequency.exponentialRampToValueAtTime(p.freq * 0.995, now + p.decay);
                g.gain.setValueAtTime(p.gain, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + p.decay);
                osc.connect(g); g.connect(master);
                osc.start(now);
                osc.stop(now + p.decay + 0.05);
            });

            // Second softer strike 90ms later → the "kr-RING" double-hit feel
            const t2 = now + 0.09;
            const osc2 = audioCtx.createOscillator();
            const g2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, t2); // G6
            g2.gain.setValueAtTime(0.5, t2);
            g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.5);
            osc2.connect(g2); g2.connect(master);
            osc2.start(t2);
            osc2.stop(t2 + 0.55);
        }

        // Soft subtle "tick" for back/secondary presses
        function playTick() {
            ensureAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, now);
            g.gain.setValueAtTime(0.12, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        /* ============================================================
           HAPTICS — works on Android Chrome; iOS Safari has no API
           ============================================================ */
        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // Unlock audio on the very first touch anywhere (iOS requirement)
        document.addEventListener('touchstart', ensureAudio, { once: true });
        document.addEventListener('click', ensureAudio, { once: true });

        /* ============================================================
           UI helpers
           ============================================================ */
        function bounce(el) {
            if (!el) return;
            el.classList.remove('bounce');
            void el.offsetWidth; // restart animation
            el.classList.add('bounce');
        }

        function animateCard(direction) {
            const card = document.getElementById('main-card');
            card.classList.remove('anim-next', 'anim-prev');
            void card.offsetWidth;
            card.classList.add(direction === 'prev' ? 'anim-prev' : 'anim-next');
        }

        /* ============================================================
           APP LOGIC
           ============================================================ */
        async function init() {
            const listEl = document.getElementById('lesson-list');
            listEl.innerHTML = '<p style="text-align:center">Syncing Master List...</p>';
            try {
                const response = await fetch(MASTER_SHEET_URL + `&cb=${Date.now()}`, { cache: "no-store" });
                const csvText = await response.text();
                parseMasterSheet(csvText);
                renderMenu();
            } catch (err) {
                listEl.innerHTML = '<p style="text-align:center; color:red;">Sync Failed. Tap to retry.</p>';
                listEl.onclick = init;
            }
        }

        function parseMasterSheet(text) {
            db = {};
            const lines = text.split(/\r?\n/);
            const dataRows = lines.slice(1);
            let lessonCounter = 1;
            let currentLessonTitle = "Lesson " + lessonCounter;
            db[currentLessonTitle] = [];

            dataRows.forEach(line => {
                if (line.trim() === '') return;
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
                    else cell += char;
                }
                result.push(cell.trim());
                const word = result[0] || "";
                if (word === "") {
                    if (db[currentLessonTitle].length > 0) {
                        lessonCounter++;
                        currentLessonTitle = "Lesson " + lessonCounter;
                        db[currentLessonTitle] = [];
                    }
                } else {
                    db[currentLessonTitle].push({
                        word: word, example: result[1] || "", meaning: result[2] || "",
                        syns: [result[3] || "", result[4] || ""], ants: [result[5] || "", result[6] || ""]
                    });
                }
            });
            Object.keys(db).forEach(key => { if(db[key].length === 0) delete db[key]; });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderMenu() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = `<div class="sync-info" onclick="init()">↻ Force Sync Sheets</div>`;
            Object.keys(db).forEach(name => {
                const d = document.createElement('div');
                d.className = 'lesson-btn';
                d.innerHTML = `<span>${name}</span><span>→</span>`;
                d.onclick = () => {
                    vibrate(15);
                    playTick();
                    startLesson(name);
                };
                list.appendChild(d);
            });
        }

        function startLesson(name) {
            // Fresh session every time — nothing carries over
            lessonWords = [...db[name]];
            queue = shuffleArray([...lessonWords]);
            doneCount = {};
            currentWord = queue.shift();
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            window.scrollTo(0, 0);
            updateCard();
            animateCard('next');
        }

        function handleCardClick() {
            if (revealStep < 2) {
                revealStep++;
                vibrate(10); // tiny haptic on reveal
                const card = document.getElementById('main-card');
                const review = card.classList.contains('is-review') ? ' is-review' : '';
                card.className = `card reveal-${revealStep} tap-pulse${review}`;
                setTimeout(() => card.classList.remove('tap-pulse'), 200);
            }
        }

        function updateCard() {
            const data = currentWord;
            revealStep = 0;
            const k = wordKey(data);
            const card = document.getElementById('main-card');
            const badge = card.querySelector('.review-badge');

            // Badge tells the learner WHY this word is back
            if (isMastered(k)) {
                card.className = 'card is-review';
                badge.innerText = '✓ Quick Review';       // fully done, just a filler
            } else if ((doneCount[k] || 0) === 1) {
                card.className = 'card is-review';
                badge.innerText = '✓ Once more to finish'; // done 1 of 2 times
            } else {
                card.className = 'card';
            }

            document.getElementById('display-word').innerText = data.word;
            document.getElementById('display-example').innerText = data.example;
            document.getElementById('display-meaning').innerText = data.meaning;
            document.getElementById('display-syn').innerHTML = data.syns.filter(s => s).map(s => `<span class="chip syn">${s}</span>`).join('');
            document.getElementById('display-ant').innerHTML = data.ants.filter(a => a).map(a => `<span class="chip ant">${a}</span>`).join('');
            updateProgress();
        }

        function updateProgress() {
            const total = lessonWords.length;
            const mastered = lessonWords.filter(w => isMastered(wordKey(w))).length;
            const halfway = lessonWords.filter(w => (doneCount[wordKey(w)] || 0) === 1).length;
            let text = `${mastered} of ${total} done`;
            if (halfway > 0) text += ` · ${halfway} almost`;
            document.getElementById('progress-text').innerText = text;
        }

        function pendingCount() {
            return lessonWords.filter(w => !isMastered(wordKey(w))).length;
        }

        // Words currently sitting in the queue (by key), to avoid duplicates
        function queuedKeys() {
            return new Set(queue.map(wordKey));
        }

        // Pad the queue with already-mastered words so a returning word
        // never reappears immediately — your spacing trick.
        // Mastered words may be reused as fillers multiple times across the session.
        function padWithFillers(needed, excludeKey) {
            const inQueue = queuedKeys();
            let fillers = shuffleArray(
                lessonWords.filter(w => {
                    const k = wordKey(w);
                    return isMastered(k) && k !== excludeKey && !inQueue.has(k);
                })
            );
            let added = 0;
            for (let i = 0; i < fillers.length && added < needed; i++, added++) {
                queue.push(fillers[i]);
            }
            // Still short (tiny lesson)? Allow mastered words to repeat as fillers
            while (added < needed && fillers.length > 0) {
                queue.push(fillers[added % fillers.length]);
                added++;
            }
        }

        // Put a word back into the queue at a random spot, at least MIN_GAP cards away
        function reinsertWithGap(word) {
            const k = wordKey(word);
            if (queue.length < MIN_GAP) {
                padWithFillers(MIN_GAP - queue.length, k);
            }
            const minPos = Math.min(MIN_GAP, queue.length);
            const pos = minPos + Math.floor(Math.random() * (queue.length - minPos + 1));
            queue.splice(pos, 0, word);
        }

        function markDone(e) {
            if (e) bounce(e.currentTarget);
            vibrate([18, 40, 12]);   // double-buzz (Android)
            playKring();             // the bell!
            const k = wordKey(currentWord);
            doneCount[k] = (doneCount[k] || 0) + 1;

            if (doneCount[k] < DONES_NEEDED) {
                // First Done — the word will come back once more, later
                reinsertWithGap(currentWord);
                showNext();
                return;
            }

            // Second Done — word is finished for this session
            if (pendingCount() === 0) {
                updateProgress();
                vibrate([30, 60, 30, 60, 60]);
                setTimeout(() => { alert("Lesson Complete! 🎉 Every word done twice."); goBack(); }, 300);
                return;
            }
            showNext();
        }

        function markNotYet(e) {
            if (e) bounce(e.currentTarget);
            vibrate(12);
            playTick();
            const k = wordKey(currentWord);
            doneCount[k] = 0; // forgetting resets progress — it needs 2 fresh Dones again

            reinsertWithGap(currentWord);
            showNext();
        }

        function showNext() {
            if (queue.length === 0) {
                // Shouldn't happen (pending words are always queued or on screen),
                // but recover gracefully just in case
                const left = lessonWords.filter(w => !isMastered(wordKey(w)));
                queue = shuffleArray(left);
            }
            currentWord = queue.shift();
            updateCard();
            animateCard('next');
        }

        function goBack(e) {
            if (e && e.currentTarget) bounce(e.currentTarget);
            vibrate(12);
            playTick();
            // Session is intentionally discarded — next open starts fresh
            queue = []; currentWord = null; doneCount = {}; lessonWords = [];
            document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
            window.scrollTo(0, 0);
        }

        init();
    </script>
</body>
</html>
